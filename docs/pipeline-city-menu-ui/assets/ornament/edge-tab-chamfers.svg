<!-- Edge tab example: HUD top-left tab 420x84, touching the top and left screen edges, 14 px 45-degree chamfer on its one free corner (bottom-right).
     Fill #0a0a0c at 86 % opacity. CSS equivalent: clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%). -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="84" viewBox="0 0 420 84">
<path d="M0 0H420V70L406 84H0Z" fill="#0a0a0c" fill-opacity="0.86"/>
</svg>
