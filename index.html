<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipeline City</title>
    <link rel="icon" href="data:," />
    <!-- Theme tokens and UI styles live in src/core/ui/ui.css. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; }
      /* The boot screen (src/app/boot.ts, docs/render/load.md): up from the first paint, before any script; it fades out over the live
         picture once the board can be seen. Its title stands where the menu's does (.title in ui.css). Sizes in vmin: ui.css sets the rem later. */
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 2.4vmin; padding-top: 14vh;
        box-sizing: border-box; background: radial-gradient(ellipse 70% 60% at 50% 62%, #141c30 0%, #0b0f14 72%) #0b0f14; color: #e2eaff;
        font-family: system-ui, 'Segoe UI', sans-serif; transition: opacity .9s ease; --boot: .04;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-title { font-size: 6vmin; line-height: 1.15; font-weight: 750; letter-spacing: .04em; text-shadow: 0 0.2vmin 2.4vmin rgba(2, 6, 18, .6); }
      .boot-bar { position: relative; width: 34vmin; height: .45vmin; border-radius: .3vmin; overflow: hidden; background: rgba(150, 170, 255, .14); }
      .boot-bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--boot)); background: linear-gradient(90deg, #8b5cff, #3be3ff); transition: transform .5s ease; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); animation: boot-sweep 1.8s ease-in-out infinite; }
      .boot-stage { font-size: 1.6vmin; letter-spacing: .14em; text-transform: uppercase; color: #8fa0cc; }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      /* The still: the last picture of the game (boot.ts `saveStill`), or the shipped one, soft behind everything. */
      .boot-still { position: absolute; inset: -4%; z-index: -1; width: 108%; height: 108%; object-fit: cover; opacity: 0; filter: blur(1.1vmin) brightness(.5) saturate(1.15); transition: opacity 1.2s ease; pointer-events: none; }
      .boot-still.on { opacity: 1; }
      #boot::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 75% 65% at 50% 55%, rgba(11, 15, 20, .15), rgba(11, 15, 20, .82)); pointer-events: none; }
      /* The CPU at work, kept simple: four cells, one lit at a time, hopping along. Only opacity and transform change, so the compositor
         keeps it going while the page builds the world. */
      .boot-pipe { display: flex; gap: 1.2vmin; margin-top: 1.6vmin; }
      .boot-pipe i { width: 3.2vmin; height: 3.2vmin; border-radius: .6vmin; background: linear-gradient(135deg, #8b5cff, #3be3ff); opacity: .16; animation: boot-hop .8s steps(1) infinite; animation-delay: calc(var(--n) * .2s); }
      @keyframes boot-hop { 0% { opacity: 1; transform: scale(1.12); box-shadow: 0 0 1.6vmin rgba(59, 227, 255, .6); } 25%, 100% { opacity: .16; transform: none; box-shadow: none; } }
      .boot-log { min-height: 8.6vmin; text-align: left; font: 1.45vmin/2.1vmin ui-monospace, 'Cascadia Mono', Consolas, monospace; color: #7f93c8; white-space: pre; }
      .boot-log em { color: #3be3ff; font-style: normal; }
      @media (prefers-reduced-motion: reduce) { #boot, .boot-bar i, .boot-still { transition: none; } .boot-bar::after { display: none; } .boot-pipe i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <div id="hud"></div>
    <div id="boot" role="status" aria-live="polite">
      <img class="boot-still" alt="" />
      <div class="boot-title">Pipeline City</div>
      <div class="boot-pipe" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-stage">Loading</div>
      <div class="boot-log" aria-hidden="true"></div>
    </div>
    <script>
      // Before any module: the still from the last visit (boot.ts `saveStill`) or the shipped one.
      (function () {
        var b = document.getElementById('boot'), img = b.querySelector('.boot-still'), src = '';
        try { src = localStorage.getItem('pc.bootStill') || ''; } catch (e) {}
        img.onload = function () { img.classList.add('on'); };
        img.onerror = function () { img.remove(); };
        img.src = src || 'boot-still.jpg';
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
