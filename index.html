<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No page zoom: the game fills the screen and a pinch is the camera's zoom (src/app/touchguard.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Pipeline City</title>
    <meta
      name="description"
      content="Pipeline City is an incremental game about building computing hardware. Assemble a PC, run client jobs, earn money and upgrade every part."
    />
    <meta name="theme-color" content="#04060f" />
    <!-- The tab's icon: the boot screen's four cells, one lit (inline, so it costs no request). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cff'/%3E%3Cstop offset='1' stop-color='%233be3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='url(%23g)'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='url(%23g)' opacity='.5'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='url(%23g)' opacity='.3'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='url(%23g)' opacity='.18'/%3E%3C/svg%3E"
    />
    <!-- Design tokens and the self-hosted IBM Plex faces (licence: src/core/ui/fonts/LICENSE.txt). Before any style, so the boot wordmark is set in Plex.
         The two faces that draw the wordmark and every tag are preloaded; the rest load when first used. No CDN. -->
    <link
      rel="preload"
      href="./src/core/ui/fonts/IBMPlexSansCondensed-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="./src/core/ui/fonts/IBMPlexMono-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/core/ui/tokens.css" />
    <!-- Theme tokens and UI styles live in src/core/ui/tokens.css and src/core/ui/ui.css. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060f;
        overscroll-behavior: none;
      }
      /* The boot screen (src/app/boot.ts, docs/render/load.md): up from the first paint, before any script; it fades out over the live
         picture once the board can be seen. Its title stands where the menu's does (.title in ui.css). Sizes in vmin: ui.css sets the rem later. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.4vmin;
        padding-top: 14vh;
        box-sizing: border-box;
        background: #04060f;
        color: #e2eaff;
        font-family: 'Plex Sans', var(--f-sans), sans-serif;
        transition: opacity var(--d-long) ease;
        --boot: 0.04;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      /* The static wordmark (SPEC 5.3, 01 position): Plex Cond 600 caps on two lines. */
      .boot-title {
        font:
          600 9.5vmin/0.86 var(--f-cond),
          'IBM Plex Sans Condensed',
          sans-serif;
        text-transform: uppercase;
        color: #e2eaff;
        text-align: center;
        width: min-content;
      }
      .boot-bar {
        position: relative;
        width: 34vmin;
        height: 0.45vmin;
        border-radius: 0.3vmin;
        overflow: hidden;
        background: rgba(150, 170, 255, 0.14);
      }
      .boot-bar i {
        position: absolute;
        inset: 0;
        transform-origin: left;
        transform: scaleX(var(--boot));
        background: linear-gradient(90deg, #8b5cff, #3be3ff);
        transition: transform var(--d-slow) ease;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        animation: boot-sweep var(--d-loop-slow) ease-in-out infinite;
      }
      .boot-stage {
        font-size: 1.6vmin;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8fa0cc;
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      /* The still: the last picture of the game (boot.ts `saveStill`), or the shipped one, soft behind everything. */
      .boot-still {
        position: absolute;
        inset: -4%;
        z-index: -1;
        width: 108%;
        height: 108%;
        object-fit: cover;
        opacity: 0;
        filter: blur(1.1vmin) brightness(0.5) saturate(1.15);
        transition: opacity var(--d-loop) ease;
        pointer-events: none;
      }
      .boot-still.on {
        opacity: 1;
      }
      #boot::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 75% 65% at 50% 55%, rgba(11, 15, 20, 0.15), rgba(11, 15, 20, 0.82));
        pointer-events: none;
      }
      /* The CPU at work, kept simple: four cells, one lit at a time, hopping along. Only opacity and transform change, so the compositor
         keeps it going while the page builds the world. */
      .boot-pipe {
        display: flex;
        gap: 1.2vmin;
        margin-top: 1.6vmin;
      }
      .boot-pipe i {
        width: 3.2vmin;
        height: 3.2vmin;
        border-radius: 0.6vmin;
        background: linear-gradient(135deg, #8b5cff, #3be3ff);
        opacity: 0.16;
        animation: boot-hop var(--d-long) steps(1) infinite;
        animation-delay: calc(var(--n) * var(--d-long) / 4);
      }
      @keyframes boot-hop {
        0% {
          opacity: 1;
          transform: scale(1.12);
          box-shadow: 0 0 1.6vmin rgba(59, 227, 255, 0.6);
        }
        25%,
        100% {
          opacity: 0.16;
          transform: none;
          box-shadow: none;
        }
      }
      .boot-log {
        min-height: 8.6vmin;
        text-align: left;
        font:
          1.45vmin/2.1vmin var(--f-mono),
          ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        color: #7f93c8;
        white-space: pre;
      }
      .boot-log em {
        color: #3be3ff;
        font-style: normal;
      }
      /* The menu stands over this screen while the world loads (boot.ts `bootMenu`): the title and the buttons are the page's own (ui.css), so the
         screen keeps its picture and a thin progress line at its foot. Its z-index goes: the HUD (a stacking context) follows it in the markup,
         so it paints over it. `bootFail` takes the class off, and the screen covers all again. */
      #boot.menu {
        z-index: auto;
        justify-content: flex-end;
        padding: 0 0 5vh;
        gap: 1.1vmin;
      }
      #boot.menu .boot-title,
      #boot.menu .boot-pipe,
      #boot.menu .boot-log {
        display: none;
      }
      /* The world could not start (boot.ts `bootFail`): the screen stays, the bar and the cells go, and the reason and a way to try again show.
         These words tell the player what to do next, so they never go under 1 rem (errortext.test.ts). `bootFail` runs after ui.css has set the rem.
         `max(1rem, 2vmin)` is 2vmin on a big screen and 1 rem on a phone, where 2vmin is tiny. The screen keeps a side gutter, so the words wrap
         inside the width and nothing scrolls sideways. The reason has the light colour of the help text: the picture shows through the words, and the
         dim colour of the Loading stage was only 3 to 3.8 : 1 on the worst pixel under it (e2e/errors.e2e.mjs reads the pixels; the rule is 4.5 : 1). */
      .boot-help,
      .boot-retry {
        display: none;
      }
      #boot.fail {
        padding-left: 1.1rem;
        padding-right: 1.1rem;
      }
      #boot.fail .boot-pipe,
      #boot.fail .boot-bar,
      #boot.fail .boot-log {
        display: none;
      }
      #boot.fail .boot-stage {
        max-width: 100%;
        text-align: center;
        font-size: max(1rem, 1.6vmin);
        color: #c5d0f0;
      }
      #boot.fail .boot-help {
        display: block;
        max-width: max(52vmin, 24rem);
        text-align: center;
        font-size: max(1rem, 2vmin);
        line-height: 1.55;
        color: #c5d0f0;
      }
      #boot.fail .boot-retry {
        display: inline-block;
        max-width: 100%;
        min-height: 3rem;
        font: inherit;
        font-size: max(1rem, 2vmin);
        color: #08102a;
        background: #3be3ff;
        border: 0;
        border-radius: max(0.8vmin, 0.4rem);
        padding: max(1vmin, 0.7rem) max(2.6vmin, 1.5rem);
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        .boot-bar i,
        .boot-still {
          transition: none;
        }
        .boot-bar::after {
          display: none;
        }
        .boot-pipe i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <!-- (the HUD follows the boot screen: while the menu stands over it, `#boot.menu`, they paint in this order) -->
    <div id="boot" role="status" aria-live="polite">
      <img class="boot-still" alt="" />
      <div class="boot-title">Pipeline City</div>
      <div class="boot-pipe" aria-hidden="true">
        <i style="--n: 0"></i><i style="--n: 1"></i><i style="--n: 2"></i><i style="--n: 3"></i>
      </div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-stage">Loading</div>
      <div class="boot-log" aria-hidden="true"></div>
      <div class="boot-help"></div>
      <button class="boot-retry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <div id="hud"></div>
    <script>
      // Before any module: the still from the last visit (boot.ts `saveStill`) or the shipped one.
      (function () {
        var b = document.getElementById('boot'),
          img = b.querySelector('.boot-still'),
          src = '';
        try {
          src = localStorage.getItem('pc.bootStill') || '';
        } catch (e) {}
        img.onload = function () {
          img.classList.add('on');
        };
        img.onerror = function () {
          img.remove();
        };
        img.src = src || 'boot-still.jpg';
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
