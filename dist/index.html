<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Pipeline City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a full-bleed pannable chip-city canvas; HUD floats on top; nerd drawer slides in on the right. */
:root{--bg:#cfd9e6;--board:#d4e6e0;--trace:#7fa9a3;--sub:#d3dcec;--die:#eef2f9;--pin:#c89b3c;--tile:#fbfcff;--ink:#18203a;--mute:#5b6788;--line:#c3cde0;--dot:#d3dbea;--panel:rgba(255,255,255,.9);
--alu:#0a9fc4;--mul:#7b5cf0;--ld:#d98a00;--st:#16a860;--br:#d62fb0;--bad:#e0284a;--on:#ffffff;--ui:'Chakra Petch',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04060f;--board:#081628;--trace:#1e4270;--sub:#0d1636;--die:#111b46;--pin:#d4af5f;--tile:#18245c;--ink:#e2eaff;--mute:#8a97c2;--line:#2a366a;--dot:#18214a;--panel:rgba(14,20,46,.88);
--alu:#3be3ff;--mul:#a68bff;--ld:#ffc247;--st:#6dffa6;--br:#ff55dc;--bad:#ff5a78;--on:#08102a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#04060f;--board:#081628;--trace:#1e4270;--sub:#0d1636;--die:#111b46;--pin:#d4af5f;--tile:#18245c;--ink:#e2eaff;--mute:#8a97c2;--line:#2a366a;--dot:#18214a;--panel:rgba(14,20,46,.88);
--alu:#3be3ff;--mul:#a68bff;--ld:#ffc247;--st:#6dffa6;--br:#ff55dc;--bad:#ff5a78;--on:#08102a;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.35 var(--ui);-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#hud>*{pointer-events:auto}
.top,.bottom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.top>*,.bottom>*{pointer-events:auto}
.brand{font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--alu);box-shadow:0 0 12px var(--alu);display:inline-block}
.seg,.dock{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);flex-wrap:wrap}
button{font:600 12px var(--ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;letter-spacing:.02em}
button:hover{border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--alu);outline-offset:2px}
button[aria-pressed="true"],.seg button.on{background:var(--alu);color:var(--on);border-color:transparent}
button:disabled{opacity:.38;cursor:not-allowed}
button svg{width:14px;height:14px;fill:currentColor;flex:none}
.act.fire{animation:fire .5s}
@keyframes fire{0%{box-shadow:0 0 0 0 var(--bad)}100%{box-shadow:0 0 0 14px transparent}}
.dock label{display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
input[type=range]{accent-color:var(--alu);width:96px}
#tip,#pin{position:absolute;z-index:5;max-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.22)}
#tip{pointer-events:none}
#pin{left:max(16px,env(safe-area-inset-left,0px));top:64px}
.tt{font:700 13px var(--mono);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.tt b{width:10px;height:10px;border-radius:3px;flex:none}
.tl{color:var(--mute);font-size:12px}.tl em{font-style:normal;color:var(--ink)}
.warn{color:var(--ld)}.good{color:var(--st)}.bad{color:var(--bad)}
#drawer{position:absolute;top:60px;right:max(16px,env(safe-area-inset-right,0px));bottom:76px;width:min(318px,calc(100% - 32px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);transition:transform .25s,opacity .25s}
#drawer.shut{transform:translateX(110%);opacity:0;pointer-events:none}
#drawer h3{margin:14px 0 8px;font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#drawer h3:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.kpi b{display:block;font:700 17px var(--mono)}.kpi span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:78px 1fr 30px;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--dot);overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--ld));border-radius:3px;transition:width .3s}
.row b{font:700 11px var(--mono);color:var(--ink);text-align:right}
#tl{width:100%;height:150px;display:block}
.grid{display:grid;gap:4px}
.regs{grid-template-columns:repeat(4,1fr)}.ram{grid-template-columns:repeat(8,1fr)}.cache{grid-template-columns:repeat(4,1fr);margin-bottom:6px}
.cell{border:1px solid var(--line);border-radius:7px;padding:3px 4px;text-align:center;font:500 11px var(--mono);min-width:0;transition:background .5s,border-color .5s}
.cell small{display:block;font-size:9px;color:var(--mute)}
.cell.hit{background:color-mix(in srgb,var(--st) 35%,transparent);border-color:var(--st)}
.cell.miss{background:color-mix(in srgb,var(--bad) 35%,transparent);border-color:var(--bad)}
.cell.on{background:color-mix(in srgb,var(--alu) 18%,transparent)}
@media (max-width:760px){#drawer{top:auto;height:38%;bottom:128px}.brand span{display:none}.dock label{display:none}}
@media (prefers-reduced-motion:reduce){.act.fire{animation:none}}
</style>
<div id="app">
<canvas id="cv" aria-label="Animated CPU pipeline. Drag to pan, scroll to zoom."></canvas>
<div id="hud">
<header class="top">
<div class="brand"><i></i><span>Pipeline City</span></div>
<nav class="seg" id="modes">
<button data-mode="unpipe" id="m-unpipe">Unpipelined</button>
<button data-mode="pipe" id="m-pipe" class="on">5-stage</button>
<button data-mode="wide" id="m-wide">2-wide</button>
<button data-mode="ooo" id="m-ooo">Out-of-order</button>
</nav>
<div class="seg">
<button id="b-theme" title="Light / dark"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z"/></svg></button>
<button id="b-drawer" title="Inspector panel" aria-pressed="true"><svg viewBox="0 0 16 16"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5h4.2v11H10z"/></svg></button>
</div>
</header>
<div id="pin" hidden></div>
<aside id="drawer">
<h3>Stats</h3><div class="kpis" id="kpis"></div><div id="lost"></div>
<h3>Timeline</h3><canvas id="tl"></canvas>
<h3>Registers</h3><div class="grid regs" id="regs"></div>
<h3>Cache &amp; memory</h3><div class="grid cache" id="cache"></div><div class="grid ram" id="ram"></div>
</aside>
<footer class="bottom">
<div class="dock" id="hz">
<button class="act" id="h-miss" title="Throw away the data cache so the next load has to go to RAM"><svg viewBox="0 0 16 16"><path d="M3 1.5h10v2.2L9.4 8l3.6 4.3v2.2H3v-2.2L6.6 8 3 3.7z"/></svg>Cache miss</button>
<button class="act" id="h-bp" title="Flip the branch predictor so the next branch is guessed wrong"><svg viewBox="0 0 16 16"><path d="M1 9l4-6 3 6 3-6 4 6-1.4.9L11 6.6 8 12.6 5 6.6 2.4 9.9z"/></svg>Mispredict</button>
<button id="h-fwd" aria-pressed="true" title="Forwarding: pass results straight to the next instruction"><svg viewBox="0 0 16 16"><path d="M1 8h9M7 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="3" width="3" height="10" rx="1"/></svg>Forwarding</button>
<button id="h-port" aria-pressed="false" title="One shared memory port: fetch and load/store fight over it"><svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>1 mem port</button>
</div>
<div class="dock">
<button id="b-play" title="Play / pause (space)"><svg viewBox="0 0 16 16" id="ic-play"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
<button id="b-step" title="Step one cycle (right arrow)"><svg viewBox="0 0 16 16"><path d="M3 2.5v11l7-5.5zM11 2h2.5v12H11z"/></svg></button>
<label>speed <input type="range" id="speed" min="1" max="10" value="3" aria-label="Speed"></label>
</div>
<div class="dock">
<button id="b-zo" title="Zoom out">&minus;</button><button id="b-zi" title="Zoom in">+</button>
<button id="b-board" title="Whole motherboard (B)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5" width="6" height="6" rx="1"/></svg></button>
<button id="b-fit" title="Zoom to the CPU die (F)"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
</div>
</footer>
<div id="tip" hidden></div>
</div>
</div>
<script>
'use strict';
/* ===== ISA + machine ===== */
const MISS = 4;
const PROG = [
  {op:'LW',  rd:1, rs1:2, imm:0},
  {op:'ADD', rd:3, rs1:1, rs2:4},
  {op:'MUL', rd:5, rs1:3, rs2:6},
  {op:'ADD', rd:7, rs1:4, rs2:6},
  {op:'SW',  rs1:2, rs2:5, imm:0},
  {op:'ADDI',rd:2, rs1:2, imm:16},
  {op:'ADDI',rd:8, rs1:8, imm:-1},
  {op:'BNE', rs1:8, rs2:0, target:0},
  {op:'ADDI',rd:8, rs1:0, imm:3},
  {op:'ADDI',rd:2, rs1:0, imm:0}
];
PROG.forEach(p => { p.rd = p.rd || 0; p.rs1 = p.rs1 || 0; p.rs2 = p.rs2 || 0; p.imm = p.imm || 0; });
const CLS = {ADD:'alu', ADDI:'alu', SUB:'alu', MUL:'mul', LW:'ld', SW:'st', BNE:'br'};
const writes = i => i.rd > 0 && i.op !== 'SW' && i.op !== 'BNE';
const isMem = i => i.op === 'LW' || i.op === 'SW';
const usesB = i => i.op === 'ADD' || i.op === 'SUB' || i.op === 'MUL' || i.op === 'BNE' || i.op === 'SW';
const srcs = i => { const s = []; if (i.rs1) s.push(i.rs1); if (usesB(i) && i.rs2) s.push(i.rs2); return s; };
function fmt(i) {
  const x = n => 'x' + n;
  switch (i.op) {
    case 'LW': return `LW ${x(i.rd)}, ${i.imm}(${x(i.rs1)})`;
    case 'SW': return `SW ${x(i.rs2)}, ${i.imm}(${x(i.rs1)})`;
    case 'ADDI': return `ADDI ${x(i.rd)}, ${x(i.rs1)}, ${i.imm}`;
    case 'BNE': return `BNE ${x(i.rs1)}, ${x(i.rs2)}, loop`;
    default: return `${i.op} ${x(i.rd)}, ${x(i.rs1)}, ${x(i.rs2)}`;
  }
}
const fmtShort = i => i.op + (i.rd ? ' x' + i.rd : '');
const lineOf = a => (a >> 4) & 3, tagOf = a => a >> 6;
const cHit = (m, a) => { const c = m.cache[lineOf(a)]; return c.valid && c.tag === tagOf(a); };
const cFill = (m, a) => { const c = m.cache[lineOf(a)]; c.valid = true; c.tag = tagOf(a); };
const rdMem = (m, a) => m.mem[a] || 0;
function calc(i, a, b) {
  switch (i.op) {
    case 'ADD': return (a + b) & 0xffff;
    case 'ADDI': return (a + i.imm) & 0xffff;
    case 'SUB': return (a - b) & 0xffff;
    case 'MUL': return (a * b) & 0xffff;
  }
  return 0;
}
function newMachine() {
  const regs = new Array(16).fill(0);
  regs[4] = 5; regs[6] = 3; regs[8] = 3;
  return {
    regs, mem: {0:10, 16:20, 32:30, 48:40},
    cache: Array.from({length:4}, () => ({valid:false, tag:-1})),
    bp: {}, pc: 0, cycle: 0, uid: 0, recent: [], touch: null,
    stat: {retired:0, miss:0, flush:0, flushed:0, branches:0, mispred:0,
           stall:{data:0, load:0, cache:0, struct:0, flush:0}}
  };
}
function mkI(m, pc) {
  const p = PROG[pc];
  const i = {id:++m.uid, pc, op:p.op, rd:p.rd, rs1:p.rs1, rs2:p.rs2, imm:p.imm, target:p.target,
             cls:CLS[p.op], vstate:'ok', why:'', cells:{}, fwdInfo:''};
  m.recent.push(i); if (m.recent.length > 24) m.recent.shift();
  return i;
}
const mkB = (m, cause) => ({bubble:true, id:'b' + (++m.uid), cause, vstate:'ok', cells:{}, cls:'bub', why:''});
function fetchGroup(m, n) {
  const g = []; let pc = m.pc;
  for (let k = 0; k < n; k++) {
    const i = mkI(m, pc); g.push(i);
    pc = (pc + 1) % PROG.length;
    if (i.op === 'BNE') { i.predT = !!m.bp[i.pc]; if (i.predT) pc = i.target; break; }
  }
  m.pc = pc; return g;
}

/* ===== Unpipelined: one instruction at a time ===== */
function EngUnpipe() {
  const E = {kind:'unpipe', W:1, stages:['IF','ID','EX','MEM','WB'], code:{IF:'F',ID:'D',EX:'X',MEM:'M',WB:'W'}};
  E.reset = () => { E.m = newMachine(); E.cur = null; E.st = 0; E.gone = []; E.ev = []; };
  E.items = () => E.cur ? [{i:E.cur, zone:E.stages[E.st], idx:0}] : [];
  E.step = function () {
    const m = E.m; m.cycle++; E.gone = []; E.ev = [];
    let c = E.cur;
    if (c && E.st === 4) { c.vstate = 'retired'; m.stat.retired++; E.gone.push(c); c = E.cur = null; }
    if (!c) {
      c = E.cur = mkI(m, m.pc); m.pc = (m.pc + 1) % PROG.length; E.st = 0;
    } else if (c.missLeft > 0 && --c.missLeft > 0) {
      m.stat.stall.cache++; E.ev.push({t:'stall', cause:'cache', stage:'MEM'});
    } else {
      if (c.missLeft === 0 && c.started) { cFill(m, c.addr); c.res = rdMem(m, c.addr); c.vstate = 'ok'; c.why = ''; c.missLeft = -1; }
      E.st++;
      const s = E.stages[E.st];
      if (s === 'EX') {
        const a = m.regs[c.rs1], b = usesB(c) ? m.regs[c.rs2] : 0; c.a = a; c.b = b;
        if (c.op === 'LW') c.addr = (a + c.imm) & 0xffff;
        else if (c.op === 'SW') { c.addr = (a + c.imm) & 0xffff; c.data = b; }
        else if (c.op === 'BNE') {
          c.actualT = a !== b; m.stat.branches++;
          m.pc = c.actualT ? c.target : (c.pc + 1) % PROG.length;
        } else c.res = calc(c, a, b);
      } else if (s === 'MEM') {
        if (c.op === 'LW') {
          c.started = true;
          if (cHit(m, c.addr)) { c.res = rdMem(m, c.addr); c.missLeft = -1; m.touch = {a:c.addr, k:'r', c:m.cycle}; }
          else { c.missLeft = MISS; m.stat.miss++; c.vstate = 'stall'; c.why = 'cache miss: fetching from RAM'; E.ev.push({t:'miss', id:c.id}); m.touch = {a:c.addr, k:'m', c:m.cycle}; }
        } else if (c.op === 'SW') { m.mem[c.addr] = c.data; m.touch = {a:c.addr, k:'w', c:m.cycle}; }
      } else if (s === 'WB') {
        if (writes(c)) { m.regs[c.rd] = c.res; E.ev.push({t:'wb', reg:c.rd, id:c.id}); }
      }
    }
    c.cells[m.cycle] = E.code[E.stages[E.st]];
  };
  E.reset(); return E;
}

/* ===== In-order, scalar (W=1) or 2-wide (W=2) 5-stage pipeline ===== */
function EngInorder(W) {
  const E = {kind:'inorder', W, stages:['IF','ID','EX','MEM','WB'], code:{IF:'F',ID:'D',EX:'X',MEM:'M',WB:'W'}};
  E.reset = () => { E.m = newMachine(); E.q = {IF:[], ID:[], EX:[], MEM:[], WB:[]}; E.gone = []; E.ev = []; };
  E.items = () => { const o = []; for (const z of E.stages) E.q[z].forEach((i, idx) => o.push({i, zone:z, idx})); return o; };
  E.step = function (o) {
    const m = E.m, q = E.q, ev = E.ev = []; E.gone = []; m.cycle++;
    const kill = i => { i.vstate = 'flushed'; i.cells[m.cycle] = 'x'; E.gone.push(i); };
    // WB: results land in the register file
    for (const i of q.WB) {
      if (!i.bubble) { if (writes(i)) { m.regs[i.rd] = i.res; ev.push({t:'wb', reg:i.rd, id:i.id}); } i.vstate = 'retired'; m.stat.retired++; }
      E.gone.push(i);
    }
    q.WB = [];
    // MEM: data cache access, misses freeze the whole pipe
    let frozen = false;
    for (const i of q.MEM) {
      if (i.bubble) continue;
      if (i.op === 'LW') {
        if (!i.started) {
          i.started = true;
          if (cHit(m, i.addr)) { i.res = rdMem(m, i.addr); i.missLeft = 0; m.touch = {a:i.addr, k:'r', c:m.cycle}; }
          else { i.missLeft = MISS; m.stat.miss++; ev.push({t:'miss', id:i.id}); i.why = 'cache miss: fetching from RAM'; m.touch = {a:i.addr, k:'m', c:m.cycle}; }
        }
        if (i.missLeft > 0) {
          if (--i.missLeft > 0) { frozen = true; i.vstate = 'stall'; }
          else { cFill(m, i.addr); i.res = rdMem(m, i.addr); i.vstate = 'ok'; i.why = ''; }
        }
      } else if (i.op === 'SW' && !i.started) {
        i.started = true; m.mem[i.addr] = i.data; m.touch = {a:i.addr, k:'w', c:m.cycle};
      }
    }
    // EX: ALU, address generation, branch resolution
    for (const i of q.EX.slice()) {
      if (i.bubble || i.exDone) continue; i.exDone = true;
      const get = r => {
        if (!r) return 0;
        let best = null;
        for (const j of q.MEM) if (!j.bubble && writes(j) && j.rd === r && j.op !== 'LW' && (!best || j.id > best.id)) best = j;
        if (best) {
          if (o.fwd) ev.push({t:'fwd', reg:r, id:i.id, src:best.id});
          i.fwdInfo += `x${r} came straight from ${fmtShort(best)} in MEM, skipping the register file. `;
          return best.res;
        }
        return m.regs[r];
      };
      const a = get(i.rs1), b = usesB(i) ? get(i.rs2) : 0; i.a = a; i.b = b;
      if (i.op === 'LW') i.addr = (a + i.imm) & 0xffff;
      else if (i.op === 'SW') { i.addr = (a + i.imm) & 0xffff; i.data = b; }
      else if (i.op === 'BNE') {
        i.actualT = a !== b; m.stat.branches++; m.bp[i.pc] = i.actualT;
        if (i.actualT !== i.predT) {
          m.stat.mispred++; m.stat.flush++;
          const idx = q.EX.indexOf(i), dead = [...q.EX.slice(idx + 1), ...q.ID, ...q.IF];
          q.EX = q.EX.slice(0, idx + 1);
          for (const y of dead) { if (!y.bubble) m.stat.flushed++; kill(y); }
          q.ID = [mkB(m, 'flush')]; q.IF = [mkB(m, 'flush')]; m.stat.stall.flush += 2;
          m.pc = i.actualT ? i.target : (i.pc + 1) % PROG.length;
          ev.push({t:'flush', id:i.id, n:dead.length});
        }
      } else i.res = calc(i, a, b);
    }
    if (frozen) { m.stat.stall.cache++; ev.push({t:'stall', cause:'cache', stage:'MEM'}); logCells(E); return; }
    // ID: hazard detection and issue
    const hazard = c => {
      for (const r of srcs(c)) {
        for (const p of q.EX) { if (p.bubble || !writes(p) || p.rd !== r) continue; if (!o.fwd) return 'data'; if (p.op === 'LW') return 'load'; }
        if (!o.fwd) for (const p of q.MEM) if (!p.bubble && writes(p) && p.rd === r) return 'data';
      }
      return null;
    };
    const idq = q.ID.slice(), ifq = q.IF.slice(), issued = []; let why = null;
    for (const c of idq) {
      if (issued.length >= W) break;

const DESC = {
  IF:['Fetch','Grabs the next instruction. Guesses which way branches go so it never has to wait.'],
  ID:['Decode','Works out what the instruction needs and checks the road ahead. Holds traffic here if an input is not ready yet.'],
  EX:['Execute','The ALU does the math, works out memory addresses and settles branches. Results can be passed straight back in (forwarding).'],
  MEM:['Memory','Loads and stores visit the data cache. A cache miss means a slow trip to RAM, and everything behind it waits.'],
  WB:['Write back','The result is written into a register. The instruction is now officially finished.'],
  IC:['Instruction cache','Fast storage for the program itself.'],
  RF:['Register file','Eight tiny scratchpads, x1 to x8. They flash when written.'],
  DC:['Data cache','Four lines of recently used data. A hit is fast, a miss freezes the pipe.'],
  RAM:['RAM','Big, slow main memory. Cells glow when touched.'],
  FQ:['Fetch queue','Fetch grabs up to two instructions per cycle and parks them here.'],
  DQ:['Rename','Gives every result a fresh tag so fake dependencies disappear and instructions can overtake each other safely.'],
  RS:['Scheduler','Instructions wait here until their inputs arrive, then jump the queue and run. The two dots show whether each input is ready.'],
  ALU0:['ALU 0','Simple math and branch checks. One cycle.'], ALU1:['ALU 1','A second simple-math unit, so two things can run at once.'],
  MUL:['Multiplier','Takes three cycles. Instructions behind it can overtake.'], LSU:['Load/store unit','Talks to the data cache. Loads wait for older stores to be sure about memory order.'],

$('b-zo').onclick = () => { fly = null; zoomAt(VW / 2, VH / 2, .8); userMoved = true; };
$('b-fit').onclick = () => flyTo(camTarget(L, drawerOpen()), 1100);
$('b-board').onclick = () => flyTo(boardTarget(drawerOpen()), 1300);
$('b-drawer').onclick = e => { const s = $('drawer').classList.toggle('shut'); e.currentTarget.setAttribute('aria-pressed', !s); if (!userMoved) fitCam(L, !s); };
$('b-theme').onclick = () => { document.documentElement.dataset.theme = T.dark ? 'light' : 'dark'; readTheme(); drawTimeline(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); });
addEventListener('resize', () => { resize(); if (!userMoved) fitCam(L, !$('drawer').classList.contains('shut')); drawTimeline(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); setRunning(!running); }
  else if (e.code === 'ArrowRight') { setRunning(false); doStep(performance.now()); }
  else if (e.key === 'f') $('b-fit').click();
  else if (e.key === 'b') $('b-board').click();
});
function frame(t) {
  stepFly(t);
  if (running && t - lastStep >= cycleMs) doStep(t);
  draw(t); requestAnimationFrame(frame);
}
readTheme(); resize();
if (innerWidth <= 900) { $('drawer').classList.add('shut'); $('b-drawer').setAttribute('aria-pressed', 'false'); }
cycleMs = SPEEDS[2]; setMode('pipe');
Object.assign(cam, boardTarget(drawerOpen())); flyTo(camTarget(L, drawerOpen()), 2400, 900);
requestAnimationFrame(frame);
</script></body></html>
