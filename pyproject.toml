# Python tooling only (the game is TypeScript). Lint: ruff, all rules. Types: basedpyright, strictest mode.
[project]
name = "pipeline-city-tools"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs", "node_modules", "dist"]

[tool.ruff.lint]
select = ["ALL"]
# Formatter conflicts, and one of each docstring pair.
ignore = ["COM812", "ISC001", "D203", "D213"]

[tool.basedpyright]
include = ["tools"]
exclude = ["docs", "node_modules", "dist"]
typeCheckingMode = "all"
